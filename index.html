<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
    <title>Shopping List</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="full-container">
      <div class="header-container">
        <p class="title-text">
          SHOPPING <br class="breaker" />
          LIST
        </p>
        <div class="add-list-container">
          <input type="text" placeholder="Write your shopping list here..." class="list-input" />
          <button class="add-btn js-add-btn">ADD</button>
          <button class="save-btn js-save-btn">SAVE</button>
        </div>
      </div>
      <div class="body-container js-body-container">
        <div class="filtering-container js-filtering-container">
          <button class="filter js-filter js-all-filter">All</button>
          <button class="filter js-filter">Bought</button>
          <button class="filter js-filter">Not Bought</button>
        </div>
        <div class="shopping-list-container js-shopping-list-container"></div>

        <div class="clear-container js-clear-container">
          <button class="clear-all-btn js-clear-all-btn">Clear All</button>
          <button class="clear-bought-btn js-clear-bought-btn">Clear Bought</button>
        </div>
        <div class="no-item-container js-no-item-container"></div>
      </div>
    </div>
  </body>
  <script src="script.js"></script>
</html>
